
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CosmReal — 成分詳細資料</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TC:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #f5efe6;
      --warm-white: #fbf8f3;
      --sage: #8ba888;
      --sage-dark: #5c7a5a;
      --clay: #c4876a;
      --charcoal: #2a2a2a;
      --ink: #1a1a1a;
      --muted: #9a9188;
      --border: #ddd5c8;
      --shadow: 0 4px 24px rgba(42, 42, 42, 0.07);
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--warm-white);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .custom-navbar {
      background: rgba(251, 248, 243, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--ink) !important;
    }

    .nav-pills .nav-link {
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 500;
    }

    .nav-pills .nav-link.active {
      background-color: var(--sage);
      color: white;
    }

    .custom-pill-container {
      background: rgba(255, 252, 247, 0.9);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px;
    }

    .main-content {
      flex-grow: 1;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .ingredient-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .query-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--sage-dark);
      margin-bottom: 8px;
    }

    .ingredient-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--ink);
    }

    .ingredient-name-zh {
      color: var(--sage-dark);
      font-size: 1.1rem;
      margin-top: 6px;
    }

    .info-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .info-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .info-text {
      color: var(--charcoal);
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      background: #f5efe6;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      margin: 4px 4px 4px 0;
      font-size: 0.9rem;
    }

    .placeholder-card {
      background: #fbf8f3;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .back-button {
      color: var(--sage-dark);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-button:hover {
      color: var(--sage-dark);
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top custom-navbar py-3">
    <div class="container">

      <a class="navbar-brand" href="/">
        CosmReal
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        class="collapse navbar-collapse justify-content-end"
        id="navbarNav"
      >
        <div class="custom-pill-container d-inline-flex mt-3 mt-lg-0">

          <ul class="navbar-nav nav-pills gap-1">

            <li class="nav-item">
              <a class="nav-link active" href="/">
                成分查詢
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/product-search">
                產品查詢
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/features">
                功能介紹
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/personal">
                個人化服務
              </a>
            </li>

          </ul>

        </div>
      </div>
    </div>
  </nav>


  <!-- MAIN CONTENT -->
  <main class="main-content container py-5" style="max-width: 960px;">

    <a href="javascript:history.back()" class="back-button">
      ← 返回搜尋結果
    </a>

    <div class="mt-4 mb-4">
      <h1 class="page-title">
        成分詳細資料
      </h1>

      <p id="pageIntro" class="text-muted">
        正在讀取成分資料...
      </p>
    </div>


    <!-- INGREDIENT CARD -->
    <div id="ingredientContainer">

      <div class="ingredient-card">

        <div class="query-label">
          INGREDIENT
        </div>

        <div id="ingredientName" class="ingredient-name">
          -
        </div>

        <div id="ingredientNameZh" class="ingredient-name-zh">
          -
        </div>


        <!-- ALIAS -->
        <div class="info-section">

          <div class="info-title">
            成分別名
          </div>

          <div id="aliasContainer" class="info-text">
            正在讀取...
          </div>

        </div>


        <!-- EFFECT -->
        <div class="info-section">

          <div class="info-title">
            主要功效
          </div>

          <div id="effectContainer" class="info-text">
            正在讀取...
          </div>

        </div>


        <!-- SKIN TYPE -->
        <div class="info-section">
          <div class="info-title">
            適用膚質
          </div>
          <div id="skinTypeContainer" class="info-text">
            正在讀取...
          </div>
        </div>

        <!-- RISK -->
        <div class="info-section">

          <div class="info-title">
            刺激／風險資訊
          </div>

          <div class="placeholder-card">
            <div class="info-text">
              此功能將於後續版本提供刺激與風險資訊。
            </div>
          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer
    class="py-5 mt-auto"
    style="
      background: var(--cream);
      color: var(--charcoal);
      border-top: 1px solid var(--border);
    "
  >

    <div class="container">

      <div class="text-center">

        <div
          class="fw-bold mb-2"
          style="
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--ink);
          "
        >
          CosmReal
        </div>

        <div class="text-muted small">
          化妝品成分知識查詢與分析系統
        </div>

      </div>

      <hr class="my-4" style="border-color: var(--border);">

      <div
        class="text-center small text-muted"
        style="
          font-family: 'DM Mono', monospace;
          font-size: 0.75rem;
        "
      >
        &copy; 2026 CosmReal
        COSMETIC INGREDIENT INTELLIGENCE PLATFORM.
        專題系統設計
      </div>

    </div>

  </footer>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>


  <script>

    // 取得網址中的 ingredient_id
    function getIngredientId() {

      const params = new URLSearchParams(
        window.location.search
      );

      return params.get("ingredient_id");

    }


    // 建立標籤
    function createTags(items) {

      if (!items || items.length === 0) {
        return "目前沒有資料。";
      }

      return items
        .map(item => `<span class="tag">${item}</span>`)
        .join("");

    }


    // 取得成分詳細資料
    async function loadIngredientDetail() {

      const ingredientId = getIngredientId();

      if (!ingredientId) {

        document.getElementById("pageIntro").textContent =
          "缺少成分 ID，無法取得成分資料。";

        return;

      }


      try {

        const response = await fetch(
          `/api/ingredients/${encodeURIComponent(ingredientId)}`
        );

        const data = await response.json();


        if (!response.ok) {

          document.getElementById("pageIntro").textContent =
            data.message || "找不到該成分。";

          return;

        }


        // 英文名稱
        document.getElementById("ingredientName").textContent =
          data.ingredient_name || "無資料";


        // 中文名稱
        document.getElementById("ingredientNameZh").textContent =
          `中文名稱：${data.ingredient_name_zh || "無資料"}`;


        // Alias
        document.getElementById("aliasContainer").innerHTML =
          createTags(data.aliases);


        // 功效
        document.getElementById("effectContainer").innerHTML =
          createTags(data.effects);

        // 適用膚質
        document.getElementById("skinTypeContainer").innerHTML =
          createTags(data.skin_types);


        // 頁面提示
        document.getElementById("pageIntro").textContent =
          "以下為系統根據資料庫整理的成分資訊。";

      } catch (error) {

        console.error(error);

        document.getElementById("pageIntro").textContent =
          "系統連線發生錯誤，無法取得成分資料。";

      }

    }


    loadIngredientDetail();

  </script>

</body>
</html>
