
<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CosmReal — 商品詳細資料</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TC:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --cream: #F5EFE6;
            --warm-white: #FBF8F3;
            --sage: #8BA888;
            --sage-dark: #5C7A5A;
            --clay: #C4876A;
            --charcoal: #2A2A2A;
            --ink: #1A1A1A;
            --muted: #9A9188;
            --border: #DDD5C8;
            --shadow: 0 4px 24px rgba(42, 42, 42, 0.07);
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--warm-white);
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */

        .custom-navbar {
            background: rgba(251, 248, 243, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--ink) !important;
        }

        .nav-pills .nav-link {
            color: var(--muted);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 500;
        }

        .nav-pills .nav-link.active {
            background-color: var(--sage);
            color: white;
        }

        .custom-pill-container {
            background: rgba(255, 252, 247, 0.9);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px;
        }

        /* Main Content */

        .main-content {
            flex-grow: 1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            margin-bottom: 16px;
        }

        .result-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .query-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--sage-dark);
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 1.6rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .product-price {
            font-family: 'DM Mono', monospace;
            font-size: 1.1rem;
            color: var(--clay);
        }

        .ingredient-item {
            background: #FBF8F3;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .ingredient-item strong {
            color: var(--charcoal);
        }

        .ingredient-name-zh {
            color: var(--sage-dark);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .ingredient-alias {
            color: #777;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .effect-text {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .back-button {
            color: var(--sage-dark);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back-button:hover {
            color: var(--sage);
        }

    </style>

</head>


<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg sticky-top custom-navbar py-3">

    <div class="container">

        <a class="navbar-brand" href="/">
            CosmReal
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNav"
        >

            <div class="custom-pill-container d-inline-flex mt-3 mt-lg-0">

                <ul class="navbar-nav nav-pills gap-1">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            成分查詢
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            aria-current="page"
                            href="/product-search"
                        >
                            產品查詢
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/features">
                            功能介紹
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/personal">
                            個人化服務
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </div>

</nav>


<!-- MAIN CONTENT -->

<div
    class="main-content container py-5"
    style="max-width: 960px;"
>

    <a
        href="javascript:history.back()"
        class="back-button"
    >
        ← 返回商品列表
    </a>


    <h1 class="mt-4">
        商品詳細資料
    </h1>


    <!-- PRODUCT INFORMATION -->

    <div class="result-card mt-4">

        <div class="query-label">
            商品名稱
        </div>

        <div
            class="product-name fw-bold"
            id="productName"
        >
            載入中...
        </div>


        <div class="query-label mt-4">
            商品價格
        </div>

        <div
            class="product-price"
            id="productPrice"
        >
            -
        </div>

    </div>


    <!-- INGREDIENT LIST -->

    <div class="result-card mt-4">

        <div class="query-label">
            成分列表
        </div>

        <div
            id="ingredientList"
            class="mt-3"
        >

            <div class="ingredient-item">
                正在載入成分資料...
            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer
    class="py-5 mt-auto"
    style="
        background: var(--cream);
        color: var(--charcoal);
        border-top: 1px solid var(--border);
    "
>

    <div class="container">

        <div class="row align-items-center">

            <div
                class="col-12 col-md-4 text-center text-md-start mb-4 mb-md-0"
            >

                <div
                    class="footer-logo fw-bold mb-2"
                    style="
                        font-family: 'Playfair Display', serif;
                        font-size: 1.5rem;
                        color: var(--ink);
                    "
                >
                    CosmReal
                </div>

                <div class="text-muted small">
                    化妝品成分知識查詢與分析系統
                </div>

            </div>


            <div class="col-6 col-md-4 text-center">

                <h6
                    class="fw-bold mb-3"
                    style="
                        font-family: 'Noto Serif TC', serif;
                        letter-spacing: 1px;
                    "
                >
                    快速連結
                </h6>

                <ul
                    class="list-unstyled mb-0 d-flex flex-column gap-2"
                >

                    <li>
                        <a
                            href="/"
                            class="text-decoration-none text-muted"
                        >
                            首頁
                        </a>
                    </li>

                    <li>
                        <a
                            href="/features"
                            class="text-decoration-none text-muted"
                        >
                            功能介紹
                        </a>
                    </li>

                    <li>
                        <a
                            href="/product-search"
                            class="text-decoration-none text-muted"
                        >
                            產品查詢
                        </a>
                    </li>

                </ul>

            </div>


            <div class="col-6 col-md-4 text-end">

                <h6
                    class="fw-bold mb-3"
                    style="
                        font-family: 'Noto Serif TC', serif;
                        letter-spacing: 1px;
                    "
                >
                    聯絡我們
                </h6>

                <ul
                    class="list-unstyled text-muted small mb-0"
                >

                    <li class="mb-2">
                        contact@beautyreal.com
                    </li>

                    <li>
                        台灣台中市
                    </li>

                </ul>

            </div>

        </div>


        <hr
            class="my-4"
            style="border-color: var(--border);"
        >


        <div
            class="text-center small text-muted"
            style="
                font-family: 'DM Mono', monospace;
                font-size: 0.75rem;
            "
        >
            &copy; 2026 CosmReal.
            COSMETIC INGREDIENT INTELLIGENCE PLATFORM.
            專題系統設計
        </div>

    </div>

</footer>


<!-- Bootstrap JS Bundle -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
></script>


<script>

async function loadProduct() {

    // 取得網址上的 product_id
    const params =
        new URLSearchParams(window.location.search);

    const productId =
        params.get("id");


    // 沒有 product_id
    if (!productId) {

        document.getElementById("productName").textContent =
            "找不到商品";

        document.getElementById("productPrice").textContent =
            "-";

        document.getElementById("ingredientList").innerHTML = `
            <div class="ingredient-item">
                找不到商品編號。
            </div>
        `;

        return;
    }


    try {

        // 呼叫商品詳細資料 API

        const response = await fetch(
            `/api/products/${productId}`
        );


        const data =
            await response.json();


        // API 錯誤

        if (!response.ok) {

            throw new Error(
                data.message || "取得商品資料失敗"
            );

        }


        // 顯示商品名稱

        document.getElementById("productName").textContent =
            data.product_name;


        // 顯示商品價格

        document.getElementById("productPrice").textContent =
            `NT$${data.price}`;


        // 成分列表

        const ingredientList =
            document.getElementById("ingredientList");


        ingredientList.innerHTML = "";


        // 顯示每一個成分

        data.ingredients.forEach(ingredient => {

            const item =
                document.createElement("div");


            item.className =
                "ingredient-item";


            let effects = "";

            // 如果有功效
            if (
                ingredient.effects &&
                ingredient.effects.length > 0
            ) {

                effects = `
                    <div class="effect-text">
                        功效：
                        ${ingredient.effects.join("、")}
                    </div>
                `;

            }

            item.innerHTML = `
                <strong>
                    ${ingredient.ingredient_name}
                </strong>

                <div class="ingredient-name-zh">
                    中文名稱：${ingredient.ingredient_name_zh || "無資料"}
                </div>

                <div class= "ingredient-alias">
                    別名：
                    ${ingredient.aliases && ingredient.aliases.length > 0
                        ? ingredient.aliases.join("、")
                        : "無資料"}
                </div>
            
                ${effects}
            `;

            ingredientList.appendChild(item);

        });


    } catch (error) {

        console.error(error);

        document.getElementById("productName").textContent =
            "無法取得商品資料";

        document.getElementById("productPrice").textContent =
            "-";

        document.getElementById("ingredientList").innerHTML = `
            <div class="ingredient-item">
                ${error.message}
            </div>
        `;

    }

}

// 執行商品資料載入
loadProduct();

</script>
</body>
</html>
