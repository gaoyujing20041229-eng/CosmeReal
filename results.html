
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CosmReal — 成分查詢結果</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TC:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --cream: #f5efe6;
        --warm-white: #fbf8f3;
        --sage: #8ba888;
        --sage-dark: #5c7a5a;
        --clay: #c4876a;
        --charcoal: #2a2a2a;
        --ink: #1a1a1a;
        --muted: #9a9188;
        --border: #ddd5c8;
        --shadow: 0 4px 24px rgba(42, 42, 42, 0.07);
      }

      body {
        font-family: "Noto Serif TC", serif;
        background: var(--warm-white);
        color: var(--charcoal);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .custom-navbar {
        background: rgba(251, 248, 243, 0.88);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
      }

      .navbar-brand {
        font-family: "Playfair Display", serif;
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--ink) !important;
      }

      .nav-pills .nav-link {
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 16px;
        font-weight: 500;
      }

      .nav-pills .nav-link.active {
        background-color: var(--sage);
        color: white;
      }

      .custom-pill-container {
        background: rgba(255, 252, 247, 0.9);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px;
      }

      .main-content {
        flex-grow: 1;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: 2.4rem;
        margin-bottom: 16px;
      }

      .result-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: var(--shadow);
      }

      .result-title {
        font-size: 1.4rem;
        margin-bottom: 12px;
      }

      .query-label {
        font-family: "DM Mono", monospace;
        font-size: 0.85rem;
        letter-spacing: 1px;
        color: var(--sage-dark);
        margin-bottom: 8px;
      }

      .result-text {
        color: var(--muted);
        line-height: 1.9;
      }

      .summary-card {
        background: #fbf8f3;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
      }

      .ingredient-name-zh {
        color: var(--sage-dark);
        font-size: 0.95rem;
        margin-top: 4px;
      }

      .ingredient-alias {
        color: #777;
        font-size: 0.9rem;
        margin-top: 4px;
      }

      .ingredient-effects {
        color: var(--charcoal);
        line-height: 1.7;
      }

      .detail-btn {
        display: inline-block;
        margin-top: 18px;
        padding: 9px 18px;
        border: 1px solid var(--sage);
        border-radius: 999px;
        color: var(--sage-dark);
        text-decoration: none;
        font-size: 0.9rem;
        transition: 0.2s;
      }

      .detail-btn:hover {
        background: var(--sage);
        color: white;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top custom-navbar py-3">
      <div class="container">
        <a class="navbar-brand" href="/">CosmReal</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <div class="custom-pill-container d-inline-flex mt-3 mt-lg-0">
            <ul class="navbar-nav nav-pills gap-1">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">
                  成分查詢
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="/product-search">
                  產品查詢
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="/features">
                  功能介紹
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="/personal">
                  個人化服務
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div
      class="main-content container py-5"
      style="max-width: 960px;"
    >
      <h1>成分查詢結果</h1>

      <p
        id="queryIntro"
        class="text-muted mb-4"
        style="line-height: 1.8;"
      >
        系統已取得您的查詢關鍵字。
      </p>

      <div class="result-card">
        <div class="query-label">成分查詢內容</div>

        <div
          class="result-title fw-bold"
          id="queryTerm"
        >
          -
        </div>

        <div class="result-text mb-4">
          以下為系統根據資料庫查詢到的相關成分，請選擇要查看的成分。
        </div>

        <!-- 成分搜尋結果 -->
        <div id="ingredientResults"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer
      class="py-5 mt-auto"
      style="
        background: var(--cream);
        color: var(--charcoal);
        border-top: 1px solid var(--border);
      "
    >
      <div class="container">
        <div class="row align-items-center">

          <div
            class="col-12 col-md-4 text-center text-md-start mb-4 mb-md-0"
          >
            <div
              class="footer-logo fw-bold mb-2"
              style="
                font-family: 'Playfair Display', serif;
                font-size: 1.5rem;
                color: var(--ink);
              "
            >
              CosmReal
            </div>

            <div class="text-muted small">
              化妝品成分知識查詢與分析系統
            </div>
          </div>

          <div class="col-6 col-md-4 text-center">
            <h6
              class="fw-bold mb-3"
              style="
                font-family: 'Noto Serif TC', serif;
                letter-spacing: 1px;
              "
            >
              快速連結
            </h6>

            <ul
              class="list-unstyled mb-0 d-flex flex-column gap-2"
            >
              <li>
                <a
                  href="/"
                  class="text-decoration-none text-muted"
                >
                  首頁
                </a>
              </li>

              <li>
                <a
                  href="/features"
                  class="text-decoration-none text-muted"
                >
                  功能介紹
                </a>
              </li>

              <li>
                <a
                  href="/product-search"
                  class="text-decoration-none text-muted"
                >
                  產品查詢
                </a>
              </li>
            </ul>
          </div>

          <div class="col-6 col-md-4 text-end">
            <h6
              class="fw-bold mb-3"
              style="
                font-family: 'Noto Serif TC', serif;
                letter-spacing: 1px;
              "
            >
              聯絡我們
            </h6>

            <ul class="list-unstyled text-muted small mb-0">
              <li class="mb-2">
                contact@beautyreal.com
              </li>
              <li>
                臺灣台中市
              </li>
            </ul>
          </div>

        </div>

        <hr
          class="my-4"
          style="border-color: var(--border);"
        />

        <div
          class="text-center small text-muted"
          style="
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
          "
        >
          &copy; 2026 CosmReal.
          COSMETIC INGREDIENT INTELLIGENCE PLATFORM.
          專題系統設計
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script>
      function parseQuery() {
        const params = new URLSearchParams(
          window.location.search
        );

        return params.get("q") || "";
      }

      async function loadIngredientResult() {
        const query = parseQuery().trim();

        // 顯示搜尋關鍵字
        document.getElementById("queryTerm").textContent =
          query || "未輸入查詢內容";

        // 沒有輸入搜尋內容
        if (!query) {
          document.getElementById("queryIntro").textContent =
            "請返回首頁輸入成分名稱後再進行搜尋。";
          return;
        }

        // 顯示讀取中
        document.getElementById("queryIntro").textContent =
          "正在從資料庫查詢成分資料...";

        try {
          const response = await fetch(
            `/api/ingredients/search?q=${encodeURIComponent(query)}`
          );

          const data = await response.json();

          // API 查詢失敗
          if (!response.ok) {
            document.getElementById("queryIntro").textContent =
              data.message || "查詢失敗";
            return;
          }

          // 搜尋結果容器
          const resultContainer =
            document.getElementById("ingredientResults");

          resultContainer.innerHTML = "";

          document.getElementById("queryIntro").textContent =
            `已從資料庫找到 ${data.ingredients.length} 筆相關成分資料。`;

          // 顯示所有搜尋結果
          data.ingredients.forEach((ingredient) => {
            const card = document.createElement("div");

            card.className = "summary-card mb-4";

            // Alias
            let aliasesText = "無資料";

            if (
              ingredient.aliases &&
              ingredient.aliases.length > 0
            ) {
              aliasesText = ingredient.aliases.join("、");
            }

            // 功效
            let effectsText =
              "目前資料庫尚未建立此成分的功效資料。";

            if (
              ingredient.effects &&
              ingredient.effects.length > 0
            ) {
              effectsText =
                ingredient.effects.join("、");
            }

            card.innerHTML = `
              <div class="query-label">
                INGREDIENT
              </div>

              <div class="result-title fw-bold">
                ${ingredient.ingredient_name}
              </div>

              <div class="ingredient-name-zh">
                中文名稱：
                ${ingredient.ingredient_name_zh || "無資料"}
              </div>

              <div class="ingredient-alias">
                別名：${aliasesText}
              </div>

              <a
                href="/ingredient-detail?ingredient_id=${ingredient.ingredient_id}"
                class="detail-btn"
              >
                查看詳細資料 →
              </a>
            `;

            resultContainer.appendChild(card);
          });

        } catch (error) {
          console.error(error);

          document.getElementById("queryIntro").textContent =
            "系統連線發生錯誤，無法取得資料庫資料。";
        }
      }

      // 執行查詢
      loadIngredientResult();
    </script>
  </body>
</html>
